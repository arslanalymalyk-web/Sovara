.revbanner.warn { border-color: var(--warn); background: var(--warn-soft); } .revbanner.warn .rb-state { color: var(--warn); }
.revbanner.crit { border-color: var(--crit); background: var(--crit-soft); } .revbanner.crit .rb-state { color: var(--crit); }
.revbanner.draft { border-style: dashed; border-color: var(--info); background: repeating-linear-gradient(135deg, var(--info-soft) 0 12px, var(--surface) 12px 24px); } .revbanner.draft .rb-state { color: var(--info); }
.revnav { display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
.revtab { display: grid; gap: 0; min-width: 72px; padding: 8px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); text-decoration: none; color: var(--ink-2); background: var(--surface); font-size: var(--fs-xs); flex: none; }
.revtab .mono { font-size: var(--fs-md); font-weight: 700; color: var(--ink); }
.revtab.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.revtab.rs-published .mono { color: var(--ok); } .revtab.rs-withdrawn .mono { color: var(--crit); text-decoration: line-through; } .revtab.rs-superseded .mono { color: var(--muted); }
.pv { position: relative; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); }
.pv-frame { display: block; width: 100%; height: min(70vh, 640px); border: 0; background: var(--white); }
.pv-img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; }
.pv-fallback { padding: var(--s2) var(--s3); margin: 0; }
.dn-submit { margin-top: 28px; }
.tr-states { display: grid; gap: 4px; font-size: var(--fs-xs); color: var(--muted); text-align: end; font-variant-numeric: tabular-nums; }
.check-grp { border: 1px solid var(--line); border-radius: var(--r-md); }
.check-grp > summary { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); cursor: pointer; }
.check-grp > summary .sev { align-self: stretch; min-height: 20px; }
.check-grp > summary .muted { flex-basis: 100%; font-size: var(--fs-xs); padding-inline-start: 16px; }
.chk-owner { font-size: var(--fs-xs); flex-basis: 100%; }
/* evidence library */
.ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); }
.ev-media { position: relative; text-decoration: none; }
.ev-img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ev-int { position: absolute; top: 8px; inset-inline-end: 8px; background: var(--crit); color: var(--on-accent); font-size: .75rem; font-weight: 700; padding: 4px 8px; border-radius: 999px; }
.vtag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); vertical-align: 1px; }
.vtag.ok { background: var(--ok-soft); color: var(--ok); }
@media (max-width: 640px) { .dc-tools { grid-template-columns: minmax(0, 1fr); } .pv-frame { height: 60vh; } .tr-states { text-align: start; } .ev-grid { grid-template-columns: minmax(0, 1fr); } }
/* ---- Stage 5: inspections, findings, corrective actions, templates ---- */
.ic-tools { display: grid; grid-template-columns: 2fr repeat(5, minmax(0, 1fr)); gap: var(--s3); align-items: end; }
.ic-narrow { display: none; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-h { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); text-transform: uppercase; text-align: center; padding: 4px 0; }
.cal-cell { min-height: 92px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); min-width: 0; }
.cal-cell.blank { border: 0; background: transparent; }
.cal-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-d { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
.cal-item { display: grid; font-size: .75rem; line-height: 1.25; padding: 4px; border-radius: 4px; text-decoration: none; color: var(--ink); background: var(--info-soft); border: 1px solid var(--info); overflow: hidden; }
.cal-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-item.ci-awaiting_review, .cal-item.ci-in_progress { background: var(--warn-soft); border-color: var(--warn); }
.cal-item.ci-completed { background: var(--ok-soft); border-color: var(--ok); }
.cal-item.ci-cancelled { background: var(--surface-2); border-color: var(--line-strong); text-decoration: line-through; }
.cal-agenda { display: none; }
.prereq-row { flex-wrap: nowrap; align-items: center; } .prereq-row .input { flex: 1; min-width: 0; } .prereq-row .check { white-space: nowrap; }
/* field inspection: thumb-sized controls, sticky actions */
.field-page { display: grid; gap: var(--s4); padding-bottom: 88px; min-width: 0; }
.fitems, .ditems { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.fitem { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s3); min-width: 0; }
.fitem.gap { border-color: var(--warn); }
.fitem.failed { border-color: var(--crit); }
.fi-h { display: flex; gap: var(--s3); align-items: flex-start; min-width: 0; }
.fi-h .t { flex: 1; display: grid; gap: 4px; min-width: 0; }
.fi-h .t .muted { font-size: var(--fs-sm); }
.fi-n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: var(--fs-xs); font-weight: 700; }
.seg-res { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.segopt { position: relative; display: grid; place-items: center; min-height: 48px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); font-weight: 600; font-size: var(--fs-sm); text-align: center; cursor: pointer; line-height: 1.2; }
.segopt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.segopt:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.segopt.sel.so-pass { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.segopt.sel.so-fail { background: var(--crit); border-color: var(--crit); color: var(--on-accent); }
.segopt.sel.so-na { background: var(--nav-bg); border-color: var(--nav-bg); color: var(--white); }
.segopt.sel.so-not_assessed { background: var(--surface-2); border-color: var(--ink-2); border-style: dashed; }
.fi-meas .input { max-width: 220px; }
.fi-progress { display: grid; gap: var(--s2); position: sticky; top: 64px; z-index: 5; }
.fi-bar { position: sticky; bottom: 0; z-index: 6; display: flex; gap: var(--s2); justify-content: flex-end; padding: var(--s3); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); }
.fi-bar .btn[aria-disabled="true"] { opacity: .55; }
.ditem { border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s3); display: grid; gap: 8px; min-width: 0; }
.ditem .fi-h > .pill { flex: none; }
.ditem.r-fail { border-color: var(--crit); background: color-mix(in srgb, var(--crit-soft) 45%, var(--surface)); }
.ditem.r-not_assessed { border-style: dashed; }
/* chain */
.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.ch-step { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px var(--s2); padding: 8px 0 8px; padding-inline-start: 24px; border-inline-start: 2px solid var(--line-strong); margin-inline-start: 8px; }
.ch-step::before { content: ""; position: absolute; inset-inline-start: -7px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--brand-orange); }
.ch-step:last-child { border-color: transparent; }
.ch-k { flex-basis: 100%; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
/* finding classification */
.fcls { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 700; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.fcls .icon { width: 14px; height: 14px; }
.fc-observation { background: var(--info-soft); color: var(--info); }
.fc-nonconformance { background: var(--warn-soft); color: var(--warn); }
.fc-hse_concern { background: var(--crit-soft); color: var(--crit); }
/* template editor */
.tpl-items { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.tpl-item { border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s3); display: grid; gap: var(--s2); }
.tpl-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2) var(--s3); align-items: end; }
.tpl-grid .wide { grid-column: span 2; }
@media (max-width: 1180px) { .ic-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); } .ic-search { grid-column: 1 / -1; } }
@media (max-width: 860px) { .ic-wide { display: none; } .ic-narrow { display: block; } .ic-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .ic-tools { grid-template-columns: minmax(0, 1fr); }
  .cal { display: none; } .cal-agenda { display: block; }
  .seg-res { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fi-bar .btn { flex: 1; }
  .fi-progress { top: 56px; }
  .tpl-grid { grid-template-columns: minmax(0, 1fr); } .tpl-grid .wide { grid-column: auto; }
}
/* ---- Stage 6: progress, daily updates, commitments, reports, handover, release, oversight ---- */
.asof { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--muted); }
.asof .icon { width: 14px; height: 14px; }
.calc { font-size: var(--fs-sm); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s2) var(--s3); overflow-x: auto; }
.pg-card .pcard-b { display: grid; gap: var(--s2); }
.pg-hero .phero-b p { color: var(--mist); }
.formrow > td { background: var(--surface-2); padding: var(--s4) !important; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--s3); }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: var(--s3); align-items: center; padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
.qrow label { display: grid; gap: 4px; font-weight: 600; }
.qinput { display: flex; align-items: center; gap: var(--s2); }
.qinput .input { min-width: 0; }
.qinput .unit { font-size: var(--fs-sm); font-weight: 600; color: var(--muted); white-space: nowrap; }
/* horizontal bar charts with units, dates and values */
.hchart { margin: 0; display: grid; gap: var(--s3); }
.hchart figcaption { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
.hchart ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.hb { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) 72px; gap: 4px var(--s3); align-items: center; }
.hb-l { font-size: var(--fs-sm); min-width: 0; overflow-wrap: anywhere; }
.hb-t { height: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.hb-t i { display: block; height: 100%; background: var(--info); border-radius: 999px; }
.hb-t i.cs-overdue { background: var(--crit); } .hb-t i.cs-at_risk { background: var(--warn); } .hb-t i.cs-complete { background: var(--ok); }
.hb-v { font-weight: 700; text-align: end; font-size: var(--fs-sm); }
.hb-n { grid-column: 2 / -1; font-size: var(--fs-xs); color: var(--muted); }
.big-num { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.big-num b { font-family: var(--font-display); font-size: var(--fs-3xl, 2.2rem); line-height: 1; font-variant-numeric: tabular-nums; }
/* report snapshot */
.snapshot { display: grid; gap: var(--s4); }
.snap-h { display: grid; gap: 4px; padding: var(--s3) var(--s4); border: 1px solid var(--brand-orange); background: var(--surface-2); border-radius: var(--r-sm); }
.snap-h span { font-size: var(--fs-sm); color: var(--muted); }
/* handover readiness */
.ho-block { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s4); border: 2px solid var(--crit); background: var(--crit-soft); border-radius: var(--r-md); color: var(--ink); }
.ho-block > .icon { color: var(--crit); flex: none; }
.ho-block div { display: grid; gap: 4px; }
.ho-req { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.hq { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.hq .t { display: grid; gap: 4px; min-width: 0; flex: 1; }
.hq .t > span { font-size: var(--fs-sm); color: var(--muted); }
.hq-i { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.hq-i .icon { width: 16px; height: 16px; }
.hq-met .hq-i { background: var(--ok-soft); color: var(--ok); }
.hq-missing .hq-i { background: var(--warn-soft); color: var(--warn); }
.hq-blocking { border-color: var(--crit); }
.hq-blocking .hq-i { background: var(--crit-soft); color: var(--crit); }
.ho-pct { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.ho-pct b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }
.ho-pct span { color: var(--muted); font-size: var(--fs-sm); }
.stack > .pill, .card-b > .pill { justify-self: start; }
.rel-item { padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
