<style>
/* Layout: split-screen sign-in; app = navy rail + paper working surface with a masthead per screen. */
:root {
  /* Brand */
  --brand-orange: #F16033;      /* sampled from the supplied RGS logo */
  --accent: #B53F16;            /* button fills and links: white text passes 4.5:1 */
  --accent-hover: #9A340F;
  --accent-soft: #F9E6DB;
  --on-accent: #FFFFFF;
  --nav-bg: #0D1E39;            /* sampled from benchmark navigation */
  --nav-bg-2: #13294B;
  --nav-ink: #D5DDEA;
  --nav-muted: #8C9BB5;
  /* Surfaces */
  --bg: #EFECE4;
  --surface: #FBFAF6;
  --surface-2: #F3F0E8;
  --line: #DAD5C8;
  --line-strong: #B9B2A0;
  --ink: #0F1B2E;
  --ink-2: #2B384E;
  --muted: #566176;
  --focus: #F16033;
  /* Semantic */
  --ok: #1E7B47; --ok-soft: #E3F4EA;
  --warn: #9A5B00; --warn-soft: #FFF2DB;
  --crit: #B4232A; --crit-soft: #FCE6E7;
  --info: #1F5FA8; --info-soft: #E4EEFA;
  /* Type */
  --font-body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Barlow Semi Condensed", "IBM Plex Sans Arabic", "Arial Narrow", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-lg: 1.0625rem; --fs-xl: 1.375rem; --fs-2xl: 2.25rem; --fs-3xl: 3.5rem;
  /* Space and shape */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --r-sm: 2px; --r-md: 3px; --r-lg: 4px;
  --shadow: none;
  --rail: 248px;
  /* Fixed colours that do not flip with the theme (rail, banners, overlays) */
  --white: #FFFFFF; --mist: #C9D3E3; --mist-dim: #9FB0C8; --accent-solid: #C9461B; --ink-crit: #1A0507; --print-ink: #0F1B2E;
  --black-a25: rgba(0,0,0,.25); --deep-a25: rgba(7,18,36,.25); --deep-a4: rgba(7,18,36,.4); --deep-a5: rgba(7,18,36,.5); --deep-a55: rgba(7,18,36,.55); --deep-a62: rgba(7,18,36,.62); --deep-a72: rgba(7,18,36,.72); --navy-a15: rgba(13,30,57,.15); --navy-a35: rgba(13,30,57,.35); --navy-a75: rgba(13,30,57,.75); --navy-a78: rgba(13,30,57,.78); --navy-a92: rgba(13,30,57,.92); --navy-a94: rgba(13,30,57,.94); --white-a08: rgba(255,255,255,.08); --white-a1: rgba(255,255,255,.1); --white-a12: rgba(255,255,255,.12); --white-a14: rgba(255,255,255,.14); --white-a2: rgba(255,255,255,.2); --white-a4: rgba(255,255,255,.4);

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #F16033; --accent-hover: #FF7A4D; --accent-soft: #3A2017; --on-accent: #0A1424;
    --nav-bg: #071224; --nav-bg-2: #0E1E38; --nav-ink: #D5DDEA; --nav-muted: #8C9BB5;
    --bg: #0A1424; --surface: #111E34; --surface-2: #15253F; --line: #22344F; --line-strong: #31476A;
    --ink: #E8EDF5; --ink-2: #C3CDDD; --muted: #95A3BB; --focus: #FF8A5C;
    --ok: #5FD38F; --ok-soft: #12321F; --warn: #F2B65A; --warn-soft: #3A2A0E; --crit: #FF8A8F; --crit-soft: #3D1418; --info: #7DB4F5; --info-soft: #132B4A;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #F16033; --accent-hover: #FF7A4D; --accent-soft: #3A2017; --on-accent: #0A1424;
  --nav-bg: #071224; --nav-bg-2: #0E1E38; --nav-ink: #D5DDEA; --nav-muted: #8C9BB5;
  --bg: #0A1424; --surface: #111E34; --surface-2: #15253F; --line: #22344F; --line-strong: #31476A;
  --ink: #E8EDF5; --ink-2: #C3CDDD; --muted: #95A3BB; --focus: #FF8A5C;
  --ok: #5FD38F; --ok-soft: #12321F; --warn: #F2B65A; --warn-soft: #3A2A0E; --crit: #FF8A8F; --crit-soft: #3D1418; --info: #7DB4F5; --info-soft: #132B4A;

  color-scheme: dark;
}
[dir="rtl"] {
  --font-body: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, "Segoe UI", Tahoma, sans-serif;
  --font-display: "IBM Plex Sans Arabic", "Barlow Semi Condensed", Tahoma, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; color: var(--ink); }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: .92em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
[dir="rtl"] .eyebrow { letter-spacing: 0; }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
[dir="rtl"] .flip { transform: scaleX(-1); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s5); border-radius: var(--r-sm); border: 1px solid transparent; font-weight: 600; font-size: var(--fs-md); cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, color .15s, transform .08s ease-out; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn-secondary:hover { border-color: var(--ink-2); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--crit); color: var(--on-accent); }
:root[data-theme="dark"] .btn-danger { color: var(--ink-crit); }
.btn-sm { min-height: 34px; padding: 0 var(--s3); font-size: var(--fs-sm); }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.iconbtn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; position: relative; }
.iconbtn:hover { background: var(--surface-2); }

/* ---------- Pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill.brand { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.tag-sample { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px dashed var(--line-strong); padding: 0px 8px; border-radius: 999px; white-space: nowrap; }

/* ---------- Forms ---------- */
.field { display: grid; gap: 8px; }
.field > label, .label { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
.control { position: relative; display: flex; align-items: center; }
.control .icon { position: absolute; inset-inline-start: 14px; color: var(--muted); pointer-events: none; }
.input, .select, .textarea { width: 100%; min-height: 48px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.control .icon ~ .input, .control .icon ~ .select { padding-inline-start: 44px; }
.textarea { min-height: 96px; padding: 12px 16px; resize: vertical; }
.input::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.input[aria-invalid="true"] { border-color: var(--crit); }
.field-error { color: var(--crit); font-size: var(--fs-sm); display: flex; gap: 8px; align-items: flex-start; }
.field-hint { color: var(--muted); font-size: var(--fs-sm); }
.check { display: inline-flex; gap: var(--s2); align-items: center; font-size: var(--fs-sm); cursor: pointer; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); cursor: pointer; position: relative; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .track { width: 40px; height: 24px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; transition: background .15s; }
.toggle .track::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; transform: translateX(0); width: 18px; height: 18px; border-radius: 50%; background: var(--white); transition: transform .15s; box-shadow: 0 1px 2px var(--black-a25); }
.toggle input:checked + .track { background: var(--accent); }
.toggle input:checked + .track::after { transform: translateX(16px); }
[dir="rtl"] .toggle input:checked + .track::after { transform: translateX(-16px); }
.toggle input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
.notice { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-sm); font-size: var(--fs-sm); background: var(--info-soft); color: var(--ink); }
.notice .icon { color: var(--info); margin-top: 0px; }
.notice > .pill { align-self: flex-start; }
.notice.warn { background: var(--warn-soft); } .notice.warn .icon { color: var(--warn); }

/* ---------- Cards ---------- */
.card { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h2, .card-h h3 { font-size: var(--fs-lg); font-weight: 600; }
.card-b { padding: var(--s5); }
.stack { display: grid; gap: var(--s3); }

/* ---------- Login ---------- */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(380px, 1fr); background: var(--nav-bg); }
.login-hero { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(24px, 5vw, 64px); color: var(--white); min-height: 320px; }
.login-hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 50%; }
.login-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--navy-a92) 0%, var(--navy-a35) 45%, var(--navy-a75) 100%); }
.login-hero > * { position: relative; z-index: 1; }
.login-hero .welcome { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 2.4vw, 2rem); color: var(--white); }
.login-hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 5.6vw, 4.6rem); line-height: .98; color: var(--white); letter-spacing: -.01em; }
.login-hero h1 b { font-weight: inherit; }
.svc-line { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: var(--s4); font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 500; }
.svc-line span { display: inline-flex; align-items: center; gap: 16px; }
.svc-line span + span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-orange); margin-inline-start: -10px; }
.login-hero .foot { font-size: var(--fs-sm); color: var(--mist); max-width: 46ch; }
.login-panel { display: grid; place-items: center; padding: clamp(16px, 4vw, 48px); background: var(--bg); color: var(--ink); }
.login-card { width: 100%; max-width: 460px; background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: clamp(24px, 4vw, 40px); box-shadow: 0 20px 60px var(--deep-a25); display: grid; gap: var(--s5); }
.logo-row { display: flex; align-items: center; gap: var(--s5); }
.logo-row .divider { width: 1px; align-self: stretch; background: var(--line); }
.logo-rgs { height: 72px; width: auto; display: block; }
.badge3d { position: relative; display: block; flex: none; width: 96px; height: 96px; }
.badge3d .logo-rgs { width: 100%; height: 100%; object-fit: contain; }
.badge3d canvas { position: absolute; inset: 0; }
.badge3d.ready .logo-rgs { visibility: hidden; }
.logo-gc { height: 56px; width: auto; display: block; }
.logo-plate { background: var(--white); border-radius: var(--r-sm); padding: 4px 8px; display: inline-flex; }
.langswitch { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.langswitch button { border: 0; background: transparent; padding: 4px 16px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; color: var(--ink-2); min-height: 30px; }
.langswitch button[aria-pressed="true"] { background: var(--nav-bg); color: var(--white); }
.login-card h2 { font-size: var(--fs-2xl); font-weight: 700; }
.or { display: flex; align-items: center; gap: var(--s3); color: var(--muted); font-size: var(--fs-sm); text-transform: uppercase; }
.or::before, .or::after { content: ""; height: 1px; flex: 1; background: var(--line); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: var(--fs-sm); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.demo-box { border: 1px dashed var(--line-strong); border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s3); background: var(--surface-2); }

/* ---------- App shell ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
.rail { background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; overflow-y: auto; z-index: 30; }
.rail-head { padding: var(--s5) var(--s5) var(--s4); display: grid; gap: var(--s3); border-bottom: 1px solid var(--white-a08); }
.rail-head .logos { display: flex; align-items: center; gap: var(--s3); }
.rail-head .logo-rgs { height: 52px; }
.rail-head .logo-gc { height: 36px; }
.rail-head .appname { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--white); line-height: 1.1; }
.rail-head .shellname { font-size: var(--fs-xs); color: var(--nav-muted); font-weight: 600; }
[dir="rtl"] .rail-head .shellname { letter-spacing: 0; }
.nav { padding: var(--s3) var(--s3) var(--s6); display: grid; gap: 4px; }
.nav-group { margin-top: var(--s4); padding: 0 var(--s3) var(--s1); font-size: .75rem; font-weight: 600; color: var(--nav-muted); }
[dir="rtl"] .nav-group { letter-spacing: 0; }
.nav a { display: flex; align-items: center; gap: var(--s3); padding: 8px var(--s3); border-radius: var(--r-sm); color: var(--nav-ink); text-decoration: none; font-size: var(--fs-md); font-weight: 500; min-height: 42px; }
.nav a:hover { background: var(--nav-bg-2); color: var(--white); }
.nav a[aria-current="page"] { background: var(--accent-solid); color: var(--white); }
.nav a .stage { margin-inline-start: auto; font-size: 10px; font-weight: 600; color: var(--nav-muted); border: 1px solid var(--white-a14); border-radius: 999px; padding: 0 8px; }
.nav a[aria-current="page"] .stage { color: var(--white); border-color: var(--white-a4); }
.rail-foot { margin-top: auto; padding: var(--s4) var(--s5) var(--s5); border-top: 1px solid var(--white-a08); font-size: var(--fs-xs); color: var(--nav-muted); display: grid; gap: var(--s2); }
.rail-foot .motto { font-family: var(--font-display); font-size: 1.1rem; color: var(--white); line-height: 1.15; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: var(--s3); padding: var(--s3) clamp(16px, 2.5vw, 28px); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .search { flex: 1; max-width: 520px; min-width: 0; }
.topbar .search .input { min-height: 42px; background: var(--surface-2); }
.scope-select { min-height: 42px; max-width: 240px; }
.top-actions { display: flex; align-items: center; gap: var(--s1); margin-inline-start: auto; }
.badge-dot { position: absolute; top: 6px; inset-inline-end: 6px; min-width: 16px; height: 16px; border-radius: 999px; background: var(--brand-orange); color: var(--nav-bg); font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.usermenu { position: relative; }
.userbtn { display: flex; align-items: center; gap: var(--s3); padding: 4px 8px; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; cursor: pointer; text-align: start; }
.userbtn:hover { background: var(--surface-2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--nav-bg); color: var(--white); display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm); flex: none; }
.avatar.customer { background: var(--brand-orange); color: var(--nav-bg); }
.userbtn .who { display: grid; line-height: 1.25; }
.userbtn .who b { font-size: var(--fs-sm); }
.userbtn .who span { font-size: var(--fs-xs); color: var(--muted); }
.menu { position: absolute; inset-inline-end: 0; top: calc(100% + 6px); width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); padding: var(--s2); display: grid; gap: 4px; z-index: 40; }
.menu button, .menu .menu-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); width: 100%; padding: 8px var(--s3); border: 0; background: transparent; border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-sm); text-align: start; }
.menu button:hover { background: var(--surface-2); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.content { padding: clamp(16px, 2.5vw, 28px); padding-block: var(--s5) var(--s10); display: grid; gap: var(--s6); max-width: 1440px; width: 100%; }
.proto-strip { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) clamp(16px, 2.5vw, 28px); background: var(--warn-soft); color: var(--ink); font-size: var(--fs-xs); border-bottom: 1px solid var(--line); }
.proto-strip .icon { width: 16px; height: 16px; color: var(--warn); }
.scrim { display: none; }

/* Banner */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; background: var(--white-a12); color: var(--white); border: 1px solid var(--white-a2); }
.chip.brand { background: var(--accent-solid); border-color: transparent; }

/* Page header for modules */
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s4); flex-wrap: wrap; }
.page-h h1 { font-size: var(--fs-2xl); font-weight: 700; font-family: var(--font-display); }
.page-h p { color: var(--muted); max-width: 70ch; margin-top: var(--s1); }

/* Grids */
.grid { display: grid; gap: var(--s5); }
.g-home { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

/* Service cards */
.svc-card { overflow: hidden; display: grid; text-decoration: none; color: inherit; }
.svc-card img { width: 100%; aspect-ratio: 290 / 128; object-fit: cover; display: block; max-width: 100%; }
.svc-card .b { padding: var(--s4); display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
.svc-card h3 { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
[dir="rtl"] .svc-card h3 { text-transform: none; letter-spacing: 0; }
.svc-card p { font-size: var(--fs-sm); color: var(--muted); }
.svc-card .go { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; flex: none; }

/* Lists */
.list { display: grid; }
.list-row { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s5); border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .t { flex: 1; min-width: 0; }
.list-row .t b { display: block; font-weight: 600; font-size: var(--fs-md); }
.list-row .t span { font-size: var(--fs-sm); color: var(--muted); }
.list-row > .pill { flex: 0 1 auto; white-space: normal; text-align: center; max-width: 45%; }
.sev { width: 8px; height: 8px; margin-block-start: 8px; align-self: flex-start; border-radius: 1px; background: var(--line-strong); flex: none; }
.sev.warn { background: var(--warn); } .sev.ok { background: var(--ok); } .sev.info { background: var(--info); } .sev.crit { background: var(--crit); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px var(--s4); font-size: var(--fs-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }

.progress { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand-orange); border-radius: 999px; }
.pkg { display: grid; grid-template-columns: 56px minmax(0, 1fr) 48px; gap: var(--s3); align-items: center; padding: var(--s3) var(--s5); border-top: 1px solid var(--line); }
.pkg:first-child { border-top: 0; }
.pkg img { width: 56px; height: 40px; object-fit: cover; border-radius: var(--r-sm); }
.pkg .t b { font-weight: 600; font-size: var(--fs-sm); display: block; }
.pkg .t span { font-size: var(--fs-xs); color: var(--muted); }

.module-tile { display: grid; gap: var(--s2); padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-decoration: none; color: inherit; min-width: 0; }
.module-tile:hover { border-color: var(--accent); }
.module-tile .top { display: flex; justify-content: space-between; align-items: center; color: var(--accent); }
.module-tile b { font-size: var(--fs-md); }
.module-tile span { font-size: var(--fs-xs); color: var(--muted); }

/* States */
.state { display: grid; justify-items: center; text-align: center; gap: var(--s3); padding: var(--s10) var(--s6); }
.state .glyph { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.state .glyph .icon { width: 30px; height: 30px; }
.state.err .glyph { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.state.denied .glyph { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.state h1, .state h2 { font-size: var(--fs-xl); } /* a state that replaces the whole page carries the page's h1 */
.state p { color: var(--muted); max-width: 52ch; }
.state .actions { display: flex; gap: var(--s3); flex-wrap: wrap; justify-content: center; margin-top: var(--s2); }
.reason { font-size: var(--fs-sm); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s3) var(--s4); text-align: start; max-width: 520px; width: 100%; }
.skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: var(--r-sm); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel, .btn .spin { animation: none; } .toggle .track::after, button:active, .btn:active, a.rec:active, .pcard:active, .iconbtn:active { transition: none; transform: none; } .toggle input:checked + .track::after { transform: translateX(16px); } [dir="rtl"] .toggle input:checked + .track::after { transform: translateX(-16px); } }

/* Tables */
.tablewrap { overflow-x: auto; position: relative; } /* contains visually-hidden text inside cells so it cannot widen the page */
table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
thead th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); position: sticky; top: 0; }
.matrix th.rot { white-space: nowrap; font-size: var(--fs-xs); }
.matrix td.c { text-align: center; }
.matrix tr.grp td { background: var(--surface-2); font-weight: 600; font-size: var(--fs-xs); color: var(--muted); }
.mk { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700; }
.mk.y { background: var(--ok-soft); color: var(--ok); }
.mk.a { background: var(--accent-soft); color: var(--accent); }
.mk.n { color: var(--line-strong); }
.legend { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: var(--fs-sm); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 8px; align-items: center; }

/* Data model diagram */
.hier { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); align-items: stretch; }
.hier .node { border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: var(--s4); background: var(--surface); position: relative; display: grid; gap: 4px; }
.hier .node b { font-family: var(--font-display); font-size: 1.15rem; }
.hier .node span { font-size: var(--fs-xs); color: var(--muted); }
.hier .node:not(:last-child)::after { content: "\203A"; position: absolute; inset-inline-end: -14px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 22px; font-weight: 700; z-index: 1; }
[dir="rtl"] .hier .node:not(:last-child)::after { content: "\2039"; }
.hier .node.n1 { border-top: 3px solid var(--nav-bg); } .hier .node.n2 { border-top: 3px solid var(--info); } .hier .node.n3 { border-top: 3px solid var(--warn); } .hier .node.n4 { border-top: 3px solid var(--brand-orange); }
:root[data-theme="dark"] .hier .node.n1 { border-top-color: var(--nav-ink); }
.entity h3 { font-family: var(--font-mono); font-size: var(--fs-md); }
.entity ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: var(--fs-sm); }
.entity li { display: flex; gap: var(--s2); justify-content: space-between; border-bottom: 1px dotted var(--line); padding-bottom: 4px; }
.entity li code { font-family: var(--font-mono); font-size: var(--fs-xs); }
.entity li em { color: var(--muted); font-style: normal; font-size: var(--fs-xs); text-align: end; }

/* Design system swatches */
.sw { display: grid; gap: 8px; }
.sw i { display: block; height: 56px; border-radius: var(--r-sm); border: 1px solid var(--line); }
.sw b { font-size: var(--fs-sm); }
.sw span { font-size: var(--fs-xs); color: var(--muted); font-family: var(--font-mono); }
.typescale > div { display: flex; gap: var(--s4); align-items: baseline; padding: var(--s2) 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.typescale code { width: 110px; color: var(--muted); font-family: var(--font-mono); font-size: var(--fs-xs); flex: none; }
.row { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.prose { display: grid; gap: var(--s3); max-width: 72ch; }
.prose h3 { font-size: var(--fs-lg); margin-top: var(--s3); }
.prose ul { margin: 0; padding-inline-start: 1.2em; display: grid; gap: 4px; }
.result { border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s2); border: 1px solid var(--line); }
.result.yes { background: var(--ok-soft); border-color: transparent; }
.result.no { background: var(--crit-soft); border-color: transparent; }
.result ol { margin: 0; padding-inline-start: 1.2em; font-size: var(--fs-sm); color: var(--ink-2); }
.toast { position: fixed; inset-inline-start: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--nav-bg); color: var(--white); padding: 12px 16px; border-radius: var(--r-md); box-shadow: var(--shadow); font-size: var(--fs-sm); z-index: 60; max-width: min(92vw, 520px); }
[dir="rtl"] .toast { transform: translateX(50%); }


/* ================= Stage 2: customer journey ================= */
:root { --svc-scf: var(--accent); --svc-ins: #1F5FA8; --svc-wpr: #0B6B6B; --svc-fpr: #8238A8; --svc-scf-bg: #FDEDE6; --svc-ins-bg: #E4EEFA; --svc-wpr-bg: #DDF3F1; --svc-fpr-bg: #F2E6F8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --svc-scf: #FF8A5C; --svc-ins: #7DB4F5; --svc-wpr: #5FD0C8; --svc-fpr: #C99BF0; --svc-scf-bg: #3A2017; --svc-ins-bg: #132B4A; --svc-wpr-bg: #0E3433; --svc-fpr-bg: #2E1A3D; } }
:root[data-theme="dark"] { --svc-scf: #FF8A5C; --svc-ins: #7DB4F5; --svc-wpr: #5FD0C8; --svc-fpr: #C99BF0; --svc-scf-bg: #3A2017; --svc-ins-bg: #132B4A; --svc-wpr-bg: #0E3433; --svc-fpr-bg: #2E1A3D; }
.muted { color: var(--muted); }
.late { color: var(--crit); font-weight: 600; }
.sec-h { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 700; }
.sec-h.sm { font-size: var(--fs-lg); display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.sub-h { font-size: var(--fs-md); font-weight: 600; margin-top: var(--s2); }
.lead { font-size: var(--fs-lg); max-width: 70ch; }
.label { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); }
[dir="rtl"] .label { letter-spacing: 0; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; max-width: 48%; }
.list-row .t > * + * { margin-top: 4px; }
.rowlink { text-decoration: none; color: inherit; }
.rowlink:hover b { color: var(--accent); }

/* record links */
.rec { display: inline-flex; align-items: center; gap: 4px; padding: 0px 8px 0px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); text-decoration: none; font-size: var(--fs-sm); white-space: nowrap; vertical-align: middle; }
.rec .icon { width: 14px; height: 14px; color: var(--accent); }
a.rec:hover { border-color: var(--accent); color: var(--ink); }
.rec.restricted { color: var(--muted); border-style: dashed; cursor: not-allowed; }
.rec.restricted .icon { color: var(--muted); }
.evlinks { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

/* breadcrumb */
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; font-size: var(--fs-sm); color: var(--muted); }
.crumbs li + li::before { content: "\203A"; margin-inline-end: 4px; color: var(--line-strong); }
[dir="rtl"] .crumbs li + li::before { content: "\2039"; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent); text-decoration: underline; }
.crumbs [aria-current] { color: var(--ink); font-weight: 600; }

/* decorative imagery (never evidence) */
.illus { position: relative; overflow: hidden; background: var(--nav-bg); }
.illus img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.illus-tag { position: absolute; inset-block-end: 8px; inset-inline-end: 8px; z-index: 3; font-size: .75rem; font-weight: 600; color: var(--white); background: var(--deep-a62); padding: 4px 8px; border-radius: 999px; }
.phero .illus-tag, .mast .illus-tag { inset-block-start: 10px; inset-block-end: auto; }

/* quick actions */
.qa-bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.qa-item { display: grid; gap: 4px; min-width: 0; }
.qa-btn { display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 0 var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; box-shadow: var(--shadow); text-align: start; }
.qa-btn .icon { color: var(--accent); width: 22px; height: 22px; }
.qa-btn:hover:not([disabled]) { border-color: var(--accent); }
.qa-btn[disabled] { opacity: .55; cursor: not-allowed; box-shadow: none; }
.why { font-size: var(--fs-xs); color: var(--muted); line-height: 1.35; }
.blocked { display: inline-grid; gap: 4px; justify-items: end; max-width: 240px; text-align: end; }
.blocked .btn .icon { width: 14px; height: 14px; }
.done-by { display: inline-flex; gap: 4px; align-items: center; font-size: var(--fs-xs); color: var(--ok); }
.done-by .icon { width: 14px; height: 14px; }

/* action types: distinct icon + colour + label */
.atype { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 700; padding: 4px 8px; border-radius: var(--r-sm); white-space: nowrap; }
[dir="rtl"] .atype { letter-spacing: 0; text-transform: none; }
.atype .icon { width: 14px; height: 14px; }
.at-document_ack { background: var(--info-soft); color: var(--info); }
.at-change_approval { background: var(--warn-soft); color: var(--warn); }
.at-inspection_signoff { background: var(--svc-fpr-bg); color: var(--svc-fpr); }
.at-customer_acceptance { background: var(--ok-soft); color: var(--ok); }
.type-legend { list-style: none; margin: var(--s3) 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3) var(--s5); }
.type-legend li { display: grid; gap: 4px; font-size: var(--fs-sm); color: var(--ink-2); justify-items: start; }

/* service tags */
.svc-tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 4px 8px; border-radius: var(--r-sm); white-space: nowrap; }
[dir="rtl"] .svc-tag { letter-spacing: 0; text-transform: none; }
.svc-scaffolding { background: var(--svc-scf-bg); color: var(--svc-scf); }
.svc-insulation { background: var(--svc-ins-bg); color: var(--svc-ins); }
.svc-waterproofing { background: var(--svc-wpr-bg); color: var(--svc-wpr); }
.svc-fireproofing { background: var(--svc-fpr-bg); color: var(--svc-fpr); }
.svc-tags { display: flex; flex-wrap: wrap; gap: 8px; }

/* project + package cards */
.pgrid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.pcard, .pkgcard { position: relative; overflow: hidden; display: flex; flex-direction: column; }
.pcard-link { position: absolute; inset: 0; z-index: 2; border-radius: var(--r-md); }
.pcard-link:focus-visible { outline-offset: -3px; }
.pcard:hover, .pkgcard:hover { border-color: var(--accent); }
.pcard-img { aspect-ratio: 16 / 7; max-width: 100%; }
.pkg-img { aspect-ratio: 16 / 6; max-width: 100%; }
.pcard-b { padding: var(--s4) var(--s5) var(--s5); display: grid; gap: var(--s2); flex: 1; align-content: start; }
.pcard-b h3 { font-size: var(--fs-lg); font-weight: 600; }
.pcard-b p { font-size: var(--fs-sm); display: flex; gap: 4px; align-items: center; }
.pcard-b p .icon { width: 15px; height: 15px; }
.pcard-prog { display: grid; gap: 8px; margin-top: var(--s1); }
.pcard-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2) var(--s4); margin: var(--s2) 0 0; padding-top: var(--s3); border-top: 1px solid var(--line); font-size: var(--fs-sm); }
.pcard-meta dt { font-size: var(--fs-xs); color: var(--muted); }
.pcard-meta dd { margin: 0; font-weight: 500; }

/* directory toolbar */
.dir-tools { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(5, minmax(0, 1fr)); gap: var(--s3); align-items: end; }
.dir-tools .input, .dir-tools .select, .act-tools .select { min-height: 42px; }
.act-tools { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: end; }
.act-tools .field { min-width: 180px; flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; }
.seg .btn { border-radius: 0; background: var(--surface); color: var(--ink-2); border: 0; }
.seg .btn .icon { width: 16px; height: 16px; }
.seg .btn[aria-pressed="true"] { background: var(--nav-bg); color: var(--white); }
:root[data-theme="dark"] .seg .btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.dirtable td { vertical-align: middle; }
.dirtable .progress { margin-top: 4px; min-width: 80px; }

/* project hero */
.phero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(240px, .9fr); background: var(--nav-bg); color: var(--white); border-radius: var(--r-lg); overflow: hidden; position: relative; min-height: 220px; }
.phero-img { position: absolute; inset: 0; }
.phero-img img { opacity: .42; }
.phero-b, .phero-prog { position: relative; z-index: 2; padding: clamp(20px, 3vw, 32px); display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.phero h1 { color: var(--white); font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 3.2vw, 2.4rem); }
.phero .mono { color: var(--mist); }
.phero-loc { color: var(--mist); display: flex; gap: 8px; align-items: center; }
.phero-meta { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s6); margin: var(--s2) 0 0; }
.phero-meta dt { font-size: var(--fs-xs); color: var(--mist-dim); }
.phero-meta dd { margin: 0; font-weight: 600; color: var(--white); }
.phero-prog { background: var(--deep-a72); border-inline-start: 1px solid var(--white-a1); }
.phero-prog .label { color: var(--mist-dim); }
.phero-prog .big { font-family: var(--font-display); font-size: 3rem; line-height: 1; color: var(--white); }
.phero-prog .progress { background: var(--white-a12); border-color: transparent; }
.phero-prog .muted { color: var(--mist); }
.svc-bars { list-style: none; margin: var(--s2) 0 0; padding: 0; display: grid; gap: 8px; font-size: var(--fs-sm); }
.svc-bars li { display: grid; grid-template-columns: 1fr auto auto; gap: var(--s3); align-items: center; }
.svc-bars .muted { color: var(--mist-dim); font-size: var(--fs-xs); }
.phero .pill { border-color: transparent; }

/* tabs */
.ptabs { border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.ptabs ul { list-style: none; display: flex; gap: 4px; margin: 0; padding: 0; min-width: max-content; }
.ptabs a, .ptabs button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; color: var(--ink-2); text-decoration: none; font-weight: 500; border: 0; background: none; border-bottom: 3px solid transparent; cursor: pointer; font-size: var(--fs-md); white-space: nowrap; }
.ptabs a:hover, .ptabs button:hover { color: var(--accent); }
.ptabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brand-orange); font-weight: 600; }
.ptabs .count { font-size: 11px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); }
.sec-nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); background: var(--bg); z-index: 5; }

/* site plan (schematic; kept left-to-right in both languages) */
.plan-wrap { display: grid; gap: var(--s3); }
.plan { position: relative; aspect-ratio: 100 / 60; max-width: 100%; border-radius: var(--r-md); border: 1px solid var(--line); overflow: hidden;
  background-color: var(--surface-2); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 5% 8.33%; }
.plan-area { position: absolute; border: 2px solid var(--nav-bg); background: color-mix(in srgb, var(--surface) 88%, transparent); border-radius: 6px; padding: 4px 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 4px; cursor: pointer; text-align: start; font-size: 11px; color: var(--ink); overflow: hidden; }
:root[data-theme="dark"] .plan-area { border-color: var(--nav-ink); }
.plan-area.area:not(.child) { border-style: dashed; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.plan-area.child { border-width: 1.5px; z-index: 2; }
.plan-area:hover, .plan-area.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); z-index: 3; }
.pa-name { line-height: 1.2; }
.pa-svcs { display: flex; flex-wrap: wrap; gap: 4px; }
.dot { display: inline-flex; align-items: center; justify-content: center; min-width: 10px; height: 18px; padding: 0 4px; border-radius: 999px; font-size: 10px; font-weight: 700; color: var(--white); }
.dot.svc-scaffolding { background: var(--svc-scf); } .dot.svc-insulation { background: var(--svc-ins); } .dot.svc-waterproofing { background: var(--svc-wpr); } .dot.svc-fireproofing { background: var(--svc-fpr); }
.legend .dot { height: 10px; width: 10px; padding: 0; min-width: 10px; }
:root[data-theme="dark"] .dot { color: var(--nav-bg); } /* light dot colours in dark mode need dark text */
.pa-issue { position: absolute; top: 4px; inset-inline-end: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--crit); color: var(--on-accent); font-size: 10px; font-weight: 700; display: grid; place-items: center; font-style: normal; }
.pa-issue.sm { position: static; display: inline-grid; }
.plan-n { position: absolute; inset-block-end: 6px; inset-inline-end: 8px; font-size: 11px; font-weight: 700; color: var(--muted); }
.plan-detail { border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s3); display: grid; gap: var(--s2); background: var(--surface-2); }
.plan.large .plan-area { font-size: 12px; }
tr.child td:nth-child(2) { padding-inline-start: 24px; color: var(--ink-2); }

/* team, lists */
.team { list-style: none; margin: 0; padding: var(--s2) var(--s5) var(--s4); display: grid; gap: var(--s3); }
.team li { display: flex; gap: var(--s3); align-items: center; }
.team .t { display: grid; min-width: 0; }
.team .t span { font-size: var(--fs-xs); color: var(--muted); }
.avatar.sm { width: 32px; height: 32px; font-size: 11px; }
.doclist { list-style: none; margin: 0; padding: var(--s2) var(--s5) var(--s4); display: grid; gap: var(--s3); }
.doclist li { display: flex; gap: var(--s3); align-items: flex-start; flex-wrap: wrap; }
.doclist .t { flex: 1; display: grid; min-width: 180px; }
.doclist .t span { font-size: var(--fs-sm); color: var(--muted); }
.kv dd .field-hint { display: block; margin-top: 4px; }
tr.current td { background: var(--accent-soft); }
.acttable td { vertical-align: middle; }
.acttable tr.can td { background: var(--accent-soft); }
.actcell { min-width: 150px; }
.chips.dark .chip { background: var(--surface); color: var(--ink); border-color: var(--line); }
.chips.dark .chip.brand { background: var(--accent-solid); color: var(--white); border-color: transparent; }

/* evidence tiles: always framed with capture metadata, never decorative photos */
.evgrid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.evidence { margin: 0; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); overflow: hidden; display: grid; }
.ev-media { position: relative; aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; align-content: center; gap: 8px; color: var(--muted); font-size: var(--fs-xs); text-align: center; padding: var(--s3); }
.ev-media.nofile { background: repeating-linear-gradient(135deg, var(--surface-2) 0 10px, var(--bg) 10px 20px); }
.ev-media .icon { width: 28px; height: 28px; }
.ev-badge { position: absolute; top: 8px; inset-inline-start: 8px; background: var(--ink); color: var(--surface); font-size: .75rem; font-weight: 700; padding: 4px 8px; border-radius: var(--r-sm); }
[dir="rtl"] .ev-badge { letter-spacing: 0; }
.evidence figcaption { padding: var(--s3); display: grid; gap: 4px; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
.ev-meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--s3); font-size: var(--fs-xs); margin: var(--s1) 0 0; }
.ev-meta dt { color: var(--muted); } .ev-meta dd { margin: 0; min-width: 0; }

/* handover */
.ho-pct { font-size: var(--fs-sm); color: var(--muted); }
.ho-list { list-style: none; margin: var(--s4) 0 0; padding: 0; display: grid; gap: var(--s3); }
.ho-list li { display: flex; gap: var(--s3); align-items: flex-start; flex-wrap: wrap; }
.ho-list li > .icon { margin-top: 4px; }
.ho-list li.met > .icon { color: var(--ok); } .ho-list li.unmet > .icon { color: var(--warn); }
.ho-list .t { flex: 1; display: grid; min-width: 180px; }
.ho-list .t span { font-size: var(--fs-sm); color: var(--muted); }

/* timeline */
.timeline, .timeline ol { list-style: none; margin: 0; padding: 0; }
.timeline { display: grid; gap: var(--s4); }
.timeline.compact { padding: var(--s3) var(--s5) var(--s4); }
.tl-date { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); margin-bottom: var(--s2); }
[dir="rtl"] .tl-date { letter-spacing: 0; }
.tl-day > ol { display: grid; gap: var(--s3); border-inline-start: 2px solid var(--line); margin-inline-start: 46px; padding-inline-start: var(--s4); }
.tl-item { position: relative; display: block; }
.tl-time { position: absolute; inset-inline-start: calc(-46px - var(--s4) - 2px); width: 40px; font-size: var(--fs-xs); color: var(--muted); top: 2px; text-align: end; }
.tl-dot { position: absolute; inset-inline-start: calc(var(--s4) * -1 - 7px); top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--brand-orange); }
.tl-item.internal .tl-dot { border-color: var(--muted); border-style: dashed; }
.tl-item p { font-size: var(--fs-md); line-height: 1.6; }
.tl-meta { font-size: var(--fs-xs); color: var(--muted); }

/* dialog */
.dlg-scrim { position: fixed; inset: 0; background: var(--deep-a55); z-index: 70; }
.dlg { position: fixed; z-index: 71; inset-inline: 0; margin-inline: auto; top: calc(env(safe-area-inset-top, 0px) + 6vh); width: min(560px, calc(100% - 32px)); max-height: calc(100vh - 12vh); overflow: auto; background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 24px 70px var(--deep-a4); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-size: var(--fs-xl); }
.dlg-b { padding: var(--s5); }
.dlg-actions { display: flex; justify-content: flex-end; gap: var(--s3); flex-wrap: wrap; }
.input.file { padding: 8px; min-height: auto; }
fieldset.field { border: 0; padding: 0; margin: 0; }
.contact { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-md); }
.contact .t { display: grid; gap: 4px; min-width: 0; }
.contact .t > span { font-size: var(--fs-sm); color: var(--muted); }
.copyrow { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.copyrow .sel { user-select: all; font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--ink); }

/* misc */
.state.compact { padding: var(--s6) var(--s5); }
.state.compact h3 { font-size: var(--fs-lg); }
.state.compact .glyph { width: 52px; height: 52px; }
.explain { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: var(--s3) var(--s4); }
.explain summary { cursor: pointer; font-weight: 600; display: flex; gap: var(--s2); align-items: center; color: var(--ink-2); }
.explain .prose { margin-top: var(--s3); font-size: var(--fs-sm); color: var(--ink-2); }
.back-row { justify-content: flex-start; }
.g-home > .grid, .g-2 > .grid { align-content: start; }
.act-narrow { display: none; }
@media (max-width: 760px) { .act-wide { display: none; } .act-narrow { display: grid; } }
@media (min-width: 981px) { .ptabs:not(.sec-nav) ul { flex-wrap: wrap; min-width: 0; } }
.plan-area.child .pa-name { padding-inline-end: 16px; }
.ho-list + .field-hint { margin-top: var(--s4); }
.btn .icon.back { width: 16px; height: 16px; transform: scaleX(-1); }
[dir="rtl"] .btn .icon.back { transform: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) { .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-home { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(86vw, 300px); transform: translateX(-100%); transition: transform .2s ease; padding-top: env(safe-area-inset-top, 0px); }
  [dir="rtl"] .rail { transform: translateX(100%); }
  .app.nav-open .rail { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: var(--deep-a5); z-index: 25; }
  .scope-select { display: none; }
  .hier { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hier .node:nth-child(2)::after { display: none; }
  .g-3 { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 981px) { .only-mobile { display: none !important; } }
@media (max-width: 860px) {
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-hero { min-height: 260px; }
  .login-hero .foot { display: none; }
}
@media (max-width: 640px) {
  .g-2, .g-4 { grid-template-columns: minmax(0, 1fr); }
  .topbar .search { display: none; }
  .userbtn .who { display: none; }
  .hier { grid-template-columns: minmax(0, 1fr); }
  .hier .node::after { display: none; }
  .logo-rgs { height: 60px; } .logo-gc { height: 46px; } .badge3d { width: 72px; height: 72px; }
  .login-card h2 { font-size: var(--fs-xl); }
}

@media (max-width: 1180px) { .dir-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dir-search { grid-column: 1 / -1; } }
@media (max-width: 860px) { .phero { grid-template-columns: minmax(0, 1fr); } .phero-prog { border-inline-start: 0; border-top: 1px solid var(--white-a1); } .qa-bar { grid-template-columns: minmax(0, 1fr); } .type-legend { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .dir-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .row-end { max-width: 100%; align-items: flex-start; }
  .list-row { flex-wrap: wrap; }
  .list-row .t { flex-basis: calc(100% - 20px); }
  .row-end { margin-inline-start: 16px; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .blocked { justify-items: start; text-align: start; }
  .plan-area { font-size: 9px; padding: 4px 4px; }
  .plan-area .pa-name b { display: block; }
  .dot { height: 15px; font-size: 9px; padding: 0 4px; }
  .tl-day > ol { margin-inline-start: 0; padding-inline-start: var(--s4); }
  .tl-time { position: static; display: inline; width: auto; margin-inline-end: 8px; }
  .sec-nav { top: calc(env(safe-area-inset-top, 0px) + 60px); }
  .dlg { top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); }
}
/* ---------------- Stage 3: requests, instructions, approvals ---------------- */
.pill.plain-ok { background: transparent; color: var(--ok); border-color: var(--ok); }
.pill.plain-ok::before { background: var(--ok); }
.done-by.declined { color: var(--crit); }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.btn-stack { display: flex; flex-wrap: wrap; gap: var(--s2); }
.btn-stack > .blocked { display: grid; gap: 4px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--s2) var(--s4); padding-top: var(--s1); }
.checks .check { align-items: flex-start; }
.proto-only { margin-top: var(--s2); padding: 8px 8px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.confirm-inline { display: inline-flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding: 8px 8px; border-radius: var(--r-sm); background: var(--accent-soft); font-size: var(--fs-sm); }
.chip-l { display: inline-block; padding: 0 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); font-size: var(--fs-xs); }
.mono.rev-badge { display: inline-block; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: var(--fs-xs); color: var(--ink-2); }
.rev-badge.cur { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* request type and decision type tags */
.rtype, .dtype { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 600; padding: 4px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.rtype .icon, .dtype .icon { width: 14px; height: 14px; }
.rt-site_issue { color: var(--crit); background: var(--crit-soft); border-color: transparent; }
.rt-scope_change { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.rt-inspection, .rt-document { color: var(--info); background: var(--info-soft); border-color: transparent; }
.rt-handover_support { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.dtype { color: var(--nav-bg); }
:root[data-theme="dark"] .dtype { color: var(--ink); }
.dt-customer_approval, .dt-completion_acceptance, .dt-customer_acceptance, .dt-request_ack { color: var(--svc-scf); background: var(--accent-soft); border-color: transparent; }
.dt-internal_review { color: var(--ink-2); background: var(--surface-2); border-color: var(--line); }
.dt-execution_authorisation, .dt-technical_signoff, .dt-inspection_signoff { color: var(--info); background: var(--info-soft); border-color: transparent; }

/* request centre */
.rq-tools { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(5, minmax(0, 1fr)); gap: var(--s3); align-items: end; }
.rq-search .control { position: relative; }
.rq-narrow { display: none; }
.rowlink { text-decoration: none; color: inherit; }
.rowlink:hover { background: var(--surface-2); }
.next { font-size: var(--fs-sm); }
.next.mine { color: var(--accent); font-weight: 600; }
@media (max-width: 1180px) { .rq-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); } .rq-search { grid-column: 1 / -1; } }
@media (max-width: 860px) { .rq-wide { display: none; } .rq-narrow { display: block; } .rq-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* wizard */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
.stepper li { flex: 1 0 auto; min-width: 104px; }
.stepper li > span, .stepper li > button { display: flex; align-items: center; gap: var(--s2); width: 100%; padding: 8px 8px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); font: inherit; font-size: var(--fs-sm); color: var(--muted); text-align: start; }
.stepper li > button { cursor: pointer; color: var(--ink-2); }
.stepper li > button:hover { border-color: var(--accent); }
.stepper .dot, .lifecycle .dot { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; padding: 0; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--muted); }
.stepper .dot .icon, .lifecycle .dot .icon { width: 14px; height: 14px; }
.stepper li.done .dot, .lifecycle li.done .dot { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.stepper li.cur > span { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.stepper li.cur .dot, .lifecycle li.cur .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.wiz-card .card-h h2:focus { outline: none; }
.wiz-nav { border-top: 1px solid var(--line); padding-top: var(--s4); margin-top: var(--s2); }
.choices { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s3); min-width: 0; }
.choices.compact { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.choice { position: relative; display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); cursor: pointer; min-width: 0; }
.choice:hover { border-color: var(--accent); }
.choice input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.choice.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--accent-soft); }
.choice:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice .t { display: grid; gap: 4px; min-width: 0; }
.choice .t b { font-weight: 600; }
.choice .t .muted { font-size: var(--fs-sm); }
.choice-img { width: 72px; height: 54px; border-radius: var(--r-sm); object-fit: cover; flex: none; }
.review { display: grid; gap: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.review > div { display: grid; grid-template-columns: 170px 1fr auto; gap: var(--s3); padding: var(--s3) var(--s4); border-top: 1px solid var(--line); align-items: start; }
.review > div:first-child { border-top: 0; }
.review dt { color: var(--muted); font-size: var(--fs-sm); }
.review dd { margin: 0; min-width: 0; }
.suggest { border: 1px solid var(--info); background: var(--info-soft); border-radius: var(--r-md); padding: var(--s3) var(--s4); display: grid; gap: 8px; justify-items: start; }
.sg-h { display: inline-flex; gap: 8px; align-items: center; font-size: var(--fs-xs); font-weight: 700; color: var(--info); }
.sg-h .icon { width: 14px; height: 14px; }
.dup { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--r-md); padding: var(--s4); display: grid; gap: var(--s3); }
.dup-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.dup-list > li { display: grid; gap: 8px; padding: var(--s3); border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }

/* uploads */
.uplist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.uplist > li { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.uplist > li > .icon { color: var(--muted); }
.uplist .t { flex: 1; min-width: 160px; display: grid; gap: 4px; }
.uplist .t .muted { font-size: var(--fs-xs); }
.uplist li.up-failed, .uplist li.up-rejected { border-color: var(--crit); background: var(--crit-soft); }
.fchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.fchips button.rec { cursor: pointer; font: inherit; font-size: var(--fs-sm); }

/* request detail */
.nextbar { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); align-items: baseline; padding: var(--s3) var(--s5); }

.nextbar .label { font-size: var(--fs-xs); font-weight: 700;  }
.thread { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.msg { display: flex; gap: var(--s3); align-items: flex-start; }
.msg .bubble { flex: 1; min-width: 0; padding: var(--s3) var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); }
.msg.from-customer .bubble { background: var(--accent-soft); border-color: transparent; }
.msg.note .bubble { background: var(--warn-soft); border-color: transparent; }
.msg-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px var(--s3); font-size: var(--fs-sm); margin-bottom: 4px; }
.msg .bubble p { font-size: var(--fs-md); }
.ai-tools { gap: var(--s2); }
.composer { border-top: 1px solid var(--line); padding-top: var(--s4); }
.internal-card { border: 1px dashed var(--crit); }
.internal-card .card-h { background: var(--crit-soft); color: var(--ink); }
.internal-card .card-h h2 { display: inline-flex; gap: 8px; align-items: center; }
.rd-form { border-top: 1px solid var(--line); padding-top: var(--s4); }
.rd-form h3:focus { outline: none; }
.revlist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.revlist > li { display: grid; gap: 4px; padding-inline-start: var(--s3); border-inline-start: 2px solid var(--line-strong); }
.difflist { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; font-size: var(--fs-sm); }

.difflist li span { overflow-wrap: anywhere; }
.doclist li.outdated { background: var(--surface-2); } /* tone, not opacity: opacity would lower the text contrast */

/* instruction lifecycle and decisions */
.lifecycle-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s3); min-width: 0; }
.lifecycle { list-style: none; margin: 0; padding: 0; display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; }

.lifecycle li::before { content: ""; position: absolute; top: 12px; inset-inline-start: -50%; width: 100%; height: 2px; background: var(--line-strong); z-index: 0; }
.lifecycle li:first-child::before { display: none; }
.lifecycle li.done::before, .lifecycle li.cur::before { background: var(--ok); }
.lifecycle .dot { position: relative; z-index: 1; }
.lifecycle .lbl { font-size: var(--fs-xs); color: var(--muted); line-height: 1.25; }

.droute { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.dr { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); border-radius: var(--r-sm); border: 1px solid var(--line); }

.dr-done .dr-dot { background: var(--ok-soft); color: var(--ok); }

.dr-pending .dr-dot { background: var(--accent); color: var(--on-accent); }

.cons { list-style: none; margin: 0; display: grid; gap: var(--s2); }
.cons li { display: grid; gap: 4px; padding: var(--s2) var(--s3); border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface-2); font-size: var(--fs-sm); }
.cons li.c-approve { border-inline-start-color: var(--ok); }
.cons li.c-reject { border-inline-start-color: var(--crit); }
.cons li.c-return { border-inline-start-color: var(--warn); }
.authblk { display: grid; gap: var(--s2); padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-sm); }
.authblk + .authblk { margin-top: var(--s2); }
.audit { font-size: var(--fs-xs); color: var(--muted); display: grid; gap: 4px; }
.audit .num { color: var(--ink-2); }
.dec-result { display: grid; gap: var(--s3); justify-items: start; padding: var(--s4); border-radius: var(--r-md); background: var(--ok-soft); }
.dec-result .ok-mark { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: var(--on-accent); }
.dec-result .kv { width: 100%; }
#dec-card h2:focus { outline: none; }
.inb-row .t { display: grid; gap: 4px; justify-items: start; }
.nt-row.unread .t b { font-weight: 700; }
.nt-row:not(.unread) .t b { font-weight: 500; color: var(--ink-2); }
.kv { grid-template-columns: max-content minmax(0, 1fr); }
.kv .doclist { padding: 0; }
.kv .doclist .t { min-width: 0; flex-basis: 100%; }
.kv dd { overflow-wrap: anywhere; }
@media (max-width: 640px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 4px; } .kv dd + dt { margin-top: var(--s2); } }
@media (max-width: 640px) {
  .stepper li { min-width: 0; flex: 0 0 auto; }
  .stepper li:not(.cur) .lbl { display: none; }
  .stepper .dot, .lifecycle .dot { height: 24px; font-size: 12px; padding: 0; }
  .review > div { grid-template-columns: 1fr auto; }
  .review dt { grid-column: 1 / -1; }
  .difflist li { grid-template-columns: 1fr; gap: 4px; }
  .rq-tools { grid-template-columns: minmax(0, 1fr); }
  .choices { grid-template-columns: minmax(0, 1fr); }
  .msg .avatar { display: none; }
}
/* ---------------- Stage 4: documents, transmittals, evidence ---------------- */
.dc-tools { display: grid; grid-template-columns: minmax(200px, 2fr) repeat(6, minmax(0, 1fr)); gap: var(--s3); align-items: end; }
.dc-search .control { position: relative; }
.dc-narrow { display: none; }
.dctable td { vertical-align: top; }
@media (max-width: 1180px) { .dc-tools { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dc-search { grid-column: 1 / -1; } }
@media (max-width: 860px) { .dc-wide { display: none; } .dc-narrow { display: block; } .dc-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.revchips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.revchip { display: inline-flex; align-items: center; gap: 4px; padding: 0px 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.revchip .icon { width: 12px; height: 12px; }

.revchip.pend { background: var(--info-soft); color: var(--info); border-style: dashed; border-color: var(--info); }

.dcat .icon { width: 14px; height: 14px; color: var(--accent); }
.folder { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.folder > summary { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); cursor: pointer; font-size: var(--fs-md); }
.folder > summary .icon { color: var(--accent); }
.subfolder { border-top: 1px solid var(--line); padding: var(--s2) var(--s4) 0; }
.subfolder .doclist { padding-inline: 0; }
/* revision banner: status must be impossible to miss */
.revbanner { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-md); border: 2px solid var(--line-strong); background: var(--surface-2); }
.revbanner .rb-rev { font-weight: 700; font-size: var(--fs-lg); }
