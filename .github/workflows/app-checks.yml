name: App checks
on:
  push:
    branches: ['**']
    paths: ['app/**', 'infra/**', 'rgs-portal/rbac.js', 'rgs-portal/fixtures/**', '.github/workflows/app-checks.yml']
  pull_request:
    paths: ['app/**', 'infra/**', 'rgs-portal/rbac.js', 'rgs-portal/fixtures/**', '.github/workflows/app-checks.yml']
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: rgs_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Access rules are in sync with the prototype
        run: npm run sync:rbac && git diff --exit-code -- src/lib/rbac/data.generated.ts
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests (in-memory PostgreSQL)
        run: npm test
      - name: Database tests again on real PostgreSQL 16
        run: npx vitest run tests/db-rls.test.ts
        env: { TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/rgs_test' }
      - run: npm run build
      - run: npm run build:migrate
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile templates and every environment's parameters
        env: { RGS_PG_ADMIN_PASSWORD: validation-only-not-a-secret }
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          for e in dev staging production; do az bicep build-params --file infra/$e.bicepparam --stdout > /dev/null; done
